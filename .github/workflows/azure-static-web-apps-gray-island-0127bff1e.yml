jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Chạy build để tạo ra thư mục dist chuẩn
      - name: Install dependencies & Build
        run: |
          npm ci
          npm run build
        env:
          VITE_GRAPHQL_URI: "https://hrmsapi-crc3crfdegesbper.westus3-01.azurewebsites.net/graphql/"

      # Upload đúng thư mục dist lên Azure
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_... }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/" # Nơi chứa package.json
          api_location: ""
          output_location: "dist" # BẮT BUỘC: Thư mục chứa file sau khi build
          skip_app_build: true # Bắt buộc true để Azure không tự build lại đè lên dist